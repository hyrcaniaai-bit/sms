apply plugin: 'com.android.application'

// Bump appVersionName (and versionCode) for a release. The GitHub Actions
// build names the APK after it (sms-gateway-v2.4.0.apk). Inside the app
// (Settings screen, Syslog dialog) CI builds also show the workflow run
// number ("2.4.0-build.57") so installed builds can be told apart; local
// builds show the plain version.
def appVersionName = "2.4.0"
def ciBuildNumber = System.getenv("GITHUB_RUN_NUMBER")
def fullVersionName = ciBuildNumber ? "${appVersionName}-build.${ciBuildNumber}" : appVersionName

android {
    namespace 'tech.bogomolov.incomingsmsgateway'
    compileSdkVersion 33

    defaultConfig {
        applicationId "tech.bogomolov.incomingsmsgateway"
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 13
        versionName fullVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Render the action-bar vector icons (e.g. the Settings gear) via the
        // support library so they work back to minSdkVersion 14.
        vectorDrawables.useSupportLibrary = true
    }

    // One fixed signing key, committed to the repo, for every build (local and
    // GitHub Actions). Without it each CI runner signs with its own freshly
    // generated debug key, and Android refuses to install an APK over one signed
    // with a different key — forcing an uninstall (and losing the rules) on
    // every update. Being in the repo, anyone with the source can sign with it;
    // that is the accepted trade-off for this self-distributed build.
    signingConfigs {
        shared {
            storeFile file('signing/app-signing.p12')
            storeType 'pkcs12'
            storePassword 'smsgateway'
            keyAlias 'sms'
            keyPassword 'smsgateway'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

// Prints the plain version name (without the CI build number); the GitHub
// workflow uses it to name the APK, e.g. sms-gateway-v2.4.0.apk.
tasks.register('printVersionName') {
    def name = appVersionName
    doLast {
        println name
    }
}

dependencies {
    def work_version = "2.7.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'org.apache.commons:commons-text:1.9'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.7.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "org.mockito:mockito-android:3.7.0"
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
