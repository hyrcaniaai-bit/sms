apply plugin: 'com.android.application'

// Every GitHub Actions build gets a new version automatically, always three
// single digits (X.Y.Z), carried like an odometer — 2.4.9 is followed by
// 2.5.0, 2.9.9 by 3.0.0. Counting starts after workflow run #21 (the last run
// before this scheme), so run #22 is 2.4.1, run #23 is 2.4.2, and so on.
// versionCode keeps growing with the raw run number, so each APK is newer than
// the last and installs over it as an update. Local builds, which have no run
// number, stay at 2.4.0 with the base versionCode.
def baseVersion = 240          // 2.4.0
def firstCountedRun = 22       // this run becomes 2.4.1
def baseVersionCode = 13
def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
def versionNumber = ciBuildNumber > 0
        ? Math.max(baseVersion, baseVersion + ciBuildNumber - firstCountedRun + 1)
        : baseVersion
def fullVersionName = "${versionNumber.intdiv(100)}.${versionNumber.intdiv(10) % 10}.${versionNumber % 10}".toString()
def fullVersionCode = baseVersionCode + ciBuildNumber

android {
    namespace 'tech.bogomolov.incomingsmsgateway'
    compileSdkVersion 33

    defaultConfig {
        applicationId "tech.bogomolov.incomingsmsgateway"
        minSdkVersion 14
        targetSdkVersion 33
        versionCode fullVersionCode
        versionName fullVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Render the action-bar vector icons (e.g. the Settings gear) via the
        // support library so they work back to minSdkVersion 14.
        vectorDrawables.useSupportLibrary = true
    }

    // One fixed signing key, committed to the repo, for every build (local and
    // GitHub Actions). Without it each CI runner signs with its own freshly
    // generated debug key, and Android refuses to install an APK over one signed
    // with a different key — forcing an uninstall (and losing the rules) on
    // every update. Being in the repo, anyone with the source can sign with it;
    // that is the accepted trade-off for this self-distributed build.
    signingConfigs {
        shared {
            storeFile file('signing/app-signing.p12')
            storeType 'pkcs12'
            storePassword 'smsgateway'
            keyAlias 'sms'
            keyPassword 'smsgateway'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Let unmocked android.* calls (e.g. Log.e in error paths) return defaults
        // instead of throwing, so logic touching them stays JVM-unit-testable.
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        buildConfig true
    }
}

// Prints the version name; the GitHub workflow uses it to name the APK,
// e.g. sms-gateway-v2.9.7.apk.
tasks.register('printVersionName') {
    def name = fullVersionName
    doLast {
        println name
    }
}

dependencies {
    def work_version = "2.7.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'org.apache.commons:commons-text:1.9'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.7.0'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "org.mockito:mockito-android:3.7.0"
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation "androidx.work:work-testing:$work_version"
}
