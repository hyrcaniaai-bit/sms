name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Name the APK after the app version (e.g. sms-gateway-v2.4.0.apk)
    # so downloaded builds can be told apart.
    - name: Rename APK with version
      id: version
      run: |
        VERSION=$(./gradlew -q :app:printVersionName | tail -n 1)
        echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/sms-gateway-v${VERSION}.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sms-gateway-v${{ steps.version.outputs.name }}
        path: app/build/outputs/apk/debug/*.apk
